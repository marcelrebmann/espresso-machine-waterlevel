<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="620" height="440" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111827">Sensor placement and calibration</text>

  <!-- Water (current level) -->
  <rect x="82" y="200" width="236" height="198" fill="#bae6fd"/>
  <line x1="82" y1="200" x2="318" y2="200" stroke="#0284c7" stroke-width="2"/>

  <!-- Tank -->
  <path d="M 80 90 L 80 400 L 320 400 L 320 90" fill="none" stroke="#374151" stroke-width="4"/>
  <!-- Bracket -->
  <rect x="64" y="72" width="272" height="18" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <!-- Sensor -->
  <rect x="150" y="50" width="100" height="26" rx="3" fill="#1e3a8a"/>
  <circle cx="178" cy="90" r="13" fill="#9ca3af" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="222" cy="90" r="13" fill="#9ca3af" stroke="#e5e7eb" stroke-width="2"/>
  <text x="200" y="68" font-size="12" fill="#ffffff" text-anchor="middle">US-015</text>
  <!-- Sensor face reference -->
  <line x1="150" y1="103" x2="420" y2="103" stroke="#111827" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="430" y="107" font-size="12" fill="#374151">sensor face</text>

  <!-- Full line -->
  <line x1="82" y1="150" x2="420" y2="150" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="430" y="154" font-size="13" fill="#16a34a" font-weight="bold">full (100 %)</text>
  <!-- Empty line -->
  <line x1="82" y1="370" x2="420" y2="370" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="430" y="374" font-size="13" fill="#dc2626" font-weight="bold">empty (0 %)</text>

  <!-- Dimensions -->
  <line x1="360" y1="106" x2="360" y2="147" stroke="#111827" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="430" y="131" font-size="12" fill="#111827" font-weight="bold">DISTANCE_FULL_CM</text>
  <text x="430" y="172" font-size="11" fill="#6b7280">keep ≥ 3 cm (sensor dead zone)</text>

  <line x1="395" y1="106" x2="395" y2="367" stroke="#111827" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="430" y="300" font-size="12" fill="#111827" font-weight="bold">DISTANCE_EMPTY_CM</text>
  <text x="430" y="316" font-size="11" fill="#6b7280">measured from the sensor face</text>

  <!-- Sound waves -->
  <g fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6">
    
    <path d="M 180 145 Q 200 157 220 145"/>
    <path d="M 174 165 Q 200 181 226 165"/>
  </g>

  <text x="200" y="300" font-size="14" fill="#0369a1" text-anchor="middle">water</text>
  <text x="30" y="428" font-size="12" fill="#374151">Mount the sensor facing straight down, away from walls and inlets, so the echo comes from the water surface.</text>
</svg>
